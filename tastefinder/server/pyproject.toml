[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taste-platform-server"
version = "0.1.0"
description = "Preference-aggregation platform for narrow interest communities."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
# Database drivers. Local dev and tests run on SQLite, which needs no driver,
# so neither of these is a hard dependency of the package.
#
# MySQL is the deployment target (docs/01_STACK_DECISIONS.md). PyMySQL is pure
# Python: no build toolchain, which matters on a host where compiling a C
# extension is awkward. mysqlclient is faster but needs one.
mysql = ["pymysql>=1.1.0"]
# Postgres remains supported and tested-capable; see the database decision in
# docs/01_STACK_DECISIONS.md for why it is no longer the default target.
postgres = ["psycopg[binary]>=3.3.4"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.165.10",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "httpx>=0.28.1",          # required by fastapi.testclient
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# NOTE: this section is load-bearing, not decorative. This project lives inside
# the houseinventory repository, whose root pytest.ini would otherwise capture
# rootdir for this directory and apply its `testpaths` to these tests. Removing
# [tool.pytest.ini_options] silently reparents this suite. Verified behaviour.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic writes these; reformatting generated revisions creates churn and
# invites hand-edits to files that should be regenerated. env.py is ours and
# stays linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()-in-a-default-argument is the documented, intended way
# to declare a dependency -- it is not evaluated at import time, only per
# request. B008 does not special-case this by default.
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
