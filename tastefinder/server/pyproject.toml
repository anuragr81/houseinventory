[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taste-platform-server"
version = "0.1.0"
description = "Preference-aggregation platform for narrow interest communities."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
# PostgreSQL driver. Deployed environments use Postgres; local dev and tests
# use SQLite, so this is not a hard dependency of the package.
postgres = ["psycopg[binary]>=3.3.4"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.165.10",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "httpx>=0.28.1",          # required by fastapi.testclient
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# NOTE: this section is load-bearing, not decorative. This project lives inside
# the houseinventory repository, whose root pytest.ini would otherwise capture
# rootdir for this directory and apply its `testpaths` to these tests. Removing
# [tool.pytest.ini_options] silently reparents this suite. Verified behaviour.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
